[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ips3608-control"
version = "0.1.0"
description = "Desktop control, measurement logging and local MCP automation for FNIRSI bench power supplies."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brandon Jank" }]
keywords = ["fnirsi", "ips3608", "dps-150", "bench-power-supply", "mcp", "serial"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = ["pyserial==3.5"]

[project.optional-dependencies]
agent = ["mcp==2.3.0"]
dev = ["mcp==2.3.0", "PyYAML==6.0.3", "build==1.6.1", "pyinstaller==6.22.3",
       "Pillow==13.0.0; python_version >= '3.11'", "Pillow>=12,<13; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/brandonjank/ips3608-control"
Issues = "https://github.com/brandonjank/ips3608-control/issues"
Repository = "https://github.com/brandonjank/ips3608-control"

[project.gui-scripts]
ips3608-control = "ips3608.app:main"

[project.scripts]
ips3608-mcp = "ips3608.mcp_server:main"

[tool.setuptools.packages.find]
include = ["ips3608*"]

[tool.setuptools.package-data]
ips3608 = ["assets/*.png", "assets/*.ico"]
